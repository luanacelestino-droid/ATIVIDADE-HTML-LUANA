<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>

<body>

    <h1>Formulário Aqui</h1>

    <form>

        Nome:
        <input type="text" placeholder="Digite seu nome aqui">
        <br><br>

        Email:
        <input type="email" placeholder="Digite um email">
        <br><br>

        Senha:
        <input type="password" placeholder="Digite uma senha">

        <br><br>

        <h2>Animal de estimação</h2>

        <input type="radio" name="animal" value="cachorro">
        Cachorro
        <br><br>

        <input type="radio" name="animal" value="gato">
        Gato
        <br><br>

        <input type="radio" name="animal" value="passarinho">
        Passarinho

        <br><br>

        <h2>O que você tem em casa?</h2>

        <input type="checkbox" name="casa" value="tv">
        TV
        <br><br>

        <input type="checkbox" name="casa" value="geladeira">
        Geladeira
        <br><br>

        <input type="checkbox" name="casa" value="computador">
        Computador

        <br><br>

        <h2>Escolha uma cor:</h2>

        <select>
            <option>Selecione uma cor</option>
            <option>Verde</option>
            <option>Azul</option>
            <option>Vermelho</option>
            <option>Amarelo</option>
        </select>

        <br><br>

        <h2>Digite sua mensagem:</h2>

        <textarea 
            rows="10" 
            cols="45" 
            placeholder="Digite aqui sua mensagem">
        </textarea>

        <br><br>

        <input type="submit" value="Enviar Formulário">

    </form>

    <br>
    <hr>
    <br>

    <a href="index.html">Voltar para principal</a>

</body>
</html>
